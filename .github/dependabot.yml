version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7

    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    versioning-strategy: increase
    cooldown:
      default-days: 7

    ignore:
      - dependency-name: 'nhsuk-frontend'

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "daily"
    versioning-strategy: auto
    cooldown:
      default-days: 7

    groups:
      dev:
        dependency-type: development
